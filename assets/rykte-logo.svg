<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Rykte" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Rykte</title>

  <!-- ripples: слух расходится от узла -->
  <g fill="none" stroke="#4EA8DE" stroke-width="6">
    <circle cx="128" cy="128" r="46" opacity="0.55"/>
    <circle cx="128" cy="128" r="74" opacity="0.32"/>
    <circle cx="128" cy="128" r="102" opacity="0.16"/>
  </g>

  <!-- links -->
  <g stroke="#1E4D6B" stroke-width="5" stroke-linecap="round" opacity="0.35">
    <line x1="128" y1="128" x2="228" y2="128"/>
    <line x1="128" y1="128" x2="178" y2="215"/>
    <line x1="128" y1="128" x2="78"  y2="215"/>
    <line x1="128" y1="128" x2="28"  y2="128"/>
    <line x1="128" y1="128" x2="78"  y2="41"/>
    <line x1="128" y1="128" x2="178" y2="41"/>
  </g>

  <!-- peers -->
  <g fill="#1E4D6B">
    <circle cx="228" cy="128" r="14"/>
    <circle cx="178" cy="215" r="14"/>
    <circle cx="78"  cy="215" r="14"/>
    <circle cx="28"  cy="128" r="14"/>
    <circle cx="78"  cy="41"  r="14"/>
    <circle cx="178" cy="41"  r="14"/>
  </g>

  <!-- origin node -->
  <circle cx="128" cy="128" r="22" fill="#4EA8DE"/>
  <circle cx="128" cy="128" r="9" fill="#FFFFFF"/>
</svg>
